name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.23.0
          runtime: node@22
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm install --global npm@11.19.1
      - run: npm publish --access public
